name: Aktualizace dat

on:
  schedule:
    - cron: "0 */3 * * *"      # každé 3 hodiny: výsledky, program, tabulky, sestava
    - cron: "5 6,18 * * *"     # 2x denně navíc i kurzy
  workflow_dispatch: {}         # ruční spuštění tlačítkem Run workflow (včetně kurzů)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout čerstvá data
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WITH_ODDS: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '5 6,18 * * *' }}
        run: |
          if [ "$WITH_ODDS" = "true" ]; then python scripts/update.py --odds; else python scripts/update.py; fi
      - name: Uložit změny
        run: |
          git config user.name "aktualizace-dat"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Aktualizace dat" && git push)
